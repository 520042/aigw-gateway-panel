# 官方 API —— OpenAI 兼容透传（api_key）
# 一手来源：旧版 catalog platforms/api-deepseek
id = "api-deepseek"
name = "DeepSeek 官方 API"
enabled = true
region = "global"

auth = "api_key"
base_url = "https://api.deepseek.com/v1"
format = "openai"

# 静态兜底清单（models_policy=live：实时 /models 取不到时，面板/路由按这份展示）
models = [
    "deepseek-v4-pro",
    "deepseek-v4-pro-max",
    "deepseek-v4.1-flash",
    "deepseek-v4-flash",
    "deepseek-chat",
    "deepseek-reasoner",
]
models_policy = "live"
stream_dialect = "sse_delta"

login_url = "https://platform.deepseek.com/"

notes = "在 DeepSeek 开放平台「API keys」创建后粘贴"