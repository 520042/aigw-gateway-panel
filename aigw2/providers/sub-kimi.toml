# 订阅反代 —— Kimi Code 国内站（OAuth oauth_device）
# 一手来源：旧版 catalog platforms/sub-kimi
# 登录：v2 登录引擎（设备码/PKCE）后续接入；当前可手动粘贴 token 走 @sub-* 路由
id = "sub-kimi"
name = "Kimi Code 国内站"
enabled = true
region = "cn"
login_url = "https://kimi.moonshot.cn"

auth = "api_key"
base_url = "https://api.kimi.com/coding/v1"
format = "openai"

# 静态兜底清单（models_policy=live：实时 /models 取不到时，面板/路由按这份展示）
models = [
    "kimi-k3",
    "kimi-for-coding",
    "kimi-k2.7-code",
    "kimi-k2.7-code-highspeed",
    "kimi-k2.6",
    "kimi-k2.5",
    "kimi-k2.5-thinking",
    "kimi-latest",
]
models_policy = "live"
stream_dialect = "sse_delta"

notes = "Kimi Code 订阅登录。国内站 auth.kimi.com。设备码登录后自动获取 token，网关直接反代。"