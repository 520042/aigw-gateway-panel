# Pollinations 免密车道 —— M1 真实对话验收用
# 端点：POST {base}/openai（OpenAI 兼容，含 SSE 流式）；GET /models（非 OpenAI 格式，故用静态清单）
# 匿名可用 openai/openai-fast 等基础模型（有速率限制）；部分高级模型需 referrer/token
id = "pollinations"
name = "Pollinations（免密车道）"
enabled = true
region = "intl"

auth = "anon"
base_url = "https://text.pollinations.ai"
chat_path = "/openai"
format = "openai"

# 静态兜底清单（models_policy=live：实时 /models 取不到时，面板/路由按这份展示）
models = [
    "openai",
    "openai-fast",
    "gpt-oss-20b",
    "ovh-reasoning",
]
models_policy = "static"
stream_dialect = "sse_delta"

notes = "免 Key 免注册。2026-10 实测上游 /models 只剩 openai-fast（GPT-OSS 20B），别名 openai / gpt-oss / gpt-oss-20b / ovh-reasoning 均可调用；openai-large 已下线（404）。匿名限速约 1 次/30 秒/IP，429 时换模型或稍等。"
