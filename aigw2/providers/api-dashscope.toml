# 官方 API —— OpenAI 兼容透传（api_key）
# 一手来源：旧版 catalog platforms/api-dashscope
id = "api-dashscope"
name = "阿里云百炼 API"
enabled = true
region = "cn"

auth = "api_key"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
format = "openai"

# 静态兜底清单（models_policy=live：实时 /models 取不到时，面板/路由按这份展示；拿到 Key 后以实时为准）
models = [
    "qwen3.8-max",
    "qwen3.8-max-preview",
    "qwen3.8-flash",
    "qwen3.7-max",
    "qwen3.7-plus",
    "qwen3.6-plus",
    "qwen3.6-flash",
    "qwen3-235b-a22b",
    "qwen-plus",
    "qwen-turbo",
    "deepseek-v4-pro",
    "deepseek-v4-flash",
    "kimi/kimi-k3",
    "glm-5.2",
    "minimax-m3",
]
models_policy = "live"
stream_dialect = "sse_delta"

login_url = "https://bailian.console.aliyun.com/"

notes = "在百炼控制台「API-KEY 管理」创建后粘贴；新用户赠大量 token。\n★ 2026-10-26 起本条目合并了原 api-bailian：两者是同一个端点（DashScope 兼容模式）、同一套 Key、同一份模型清单，面板上重复出卡且同名模型会多出一条永远失败的路由。老配置里写的 模型id@api-bailian 请改成 @api-dashscope。"