# 官方 API —— OpenAI 兼容透传（api_key）
# 一手来源：C:/Users/liang.zhao/.dsh/our-free-model/rollback/src/providers/registry.json（37 个候选里的 scaleway）
id = "api-scaleway"
name = "Scaleway"
enabled = true
region = "intl"

auth = "api_key"
base_url = "https://api.scaleway.ai/v1"
format = "openai"

# 静态兜底清单（models_policy=live：实时 /models 取不到时按这份展示；拿到 Key 后以实时为准）
models = [
    "deepseek/deepseek-v4-flash",
]
models_policy = "live"
stream_dialect = "sse_delta"

login_url = "https://console.scaleway.com/iam/api-keys"

notes = "Scaleway Generative APIs; SCW secret key."
