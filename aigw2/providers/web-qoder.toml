# Qoder（直连模型端点，国际站） —— 原生 COSY 协议（qoder adapter）
# 一手来源：_refs/qoder2api-hub-main（qoder_proxy.py）+ catalog relay_specs/web-qoder
id = "web-qoder"
name = "Qoder（直连模型端点）"
enabled = true
region = "intl"

auth = "api_key"
base_url = "https://api1.qoder.sh"
format = "openai"

models = [
    "Auto",
    "Ultimate",
    "Performance",
    "Efficient",
    "Sonus",
    "Cantus",
    "Qwen3.8-Max",
    "Qwen3.8-Flash",
    "Qwen3.7-Max",
    "Qwen3.7-Plus",
    "Kimi-K3",
    "Kimi-K2.8-Preview",
    "GLM-5.3",
    "GLM-5.3-Flash",
    "DeepSeek-V4-Pro",
    "DeepSeek-Flash",
    "MiniMax-M3",
]
models_policy = "static"
stream_dialect = "sse_delta"
upstream_kind = "qoder"

biz_err = ["statusCodeValue", "quota", "unauthorized"]

login_url = "https://qoder.com/"
hosts = ["qoder.sh", "qoder.com"]

notes = "★ 与 apk-qoder 同一套原生链路，凭据同为 Qoder accessToken（dt- 开头）。Auto 走 trial credits 时最省。"

[headers]
x-qoder-region = "intl"
