# 官方 API —— OpenAI 兼容透传（api_key）
# 一手来源：旧版 catalog platforms/api-zhipu
id = "api-zhipu"
name = "智谱 BigModel API"
enabled = true
region = "cn"

auth = "api_key"
# ★ 2026-10-26 修正：此前写的是 https://open.bigmodel.cn/v1 —— 该路径下 chat 返回
#   405（nginx）、models 返回 HTML 首页，于是这个源**转发与拉清单全废**，而面板只显示
#   「近24h 失败」，看不出是地址写错了。实测 OpenAI 兼容端点是 /api/paas/v4：
#   POST /api/paas/v4/chat/completions → 401（缺 Key，端点活着）
#   GET  /api/paas/v4/models           → 401（同上）
base_url = "https://open.bigmodel.cn/api/paas/v4"
format = "openai"

# 静态兜底清单（models_policy=live：实时 /models 取不到时，面板/路由按这份展示）
models = [
    "glm-5.3",
    "glm-5.3-flash",
    "glm-5.2",
    "glm-5.1",
    "glm-5-turbo",
    "glm-5",
    "glm-4.7",
    "glm-4.6v",
]
models_policy = "live"
stream_dialect = "sse_delta"

login_url = "https://open.bigmodel.cn/usercenter/apikeys"

notes = "在智谱「API keys」创建后粘贴；GLM-Flash 系免费"