# Qoder（阿里桌面端，原通义灵码国际版） —— 原生 COSY 协议（qoder adapter）
# 一手来源：_refs/qoder2api-hub-main（qoder_proxy.py / qoder_sign.py）
id = "apk-qoder"
name = "Qoder（阿里桌面端，原通义灵码国际版）"
enabled = true
region = "intl"

auth = "api_key"
# 数据面网关（adapter 内部按区域自动在 api1/api2/api3.qoder.sh 之间切换）
base_url = "https://api1.qoder.sh"
format = "openai"

models = [
    "Auto",
    "Ultimate",
    "Performance",
    "Efficient",
    "Sonus",
    "Cantus",
    "Qwen3.8-Max",
    "Qwen3.8-Flash",
    "Qwen3.7-Max",
    "Qwen3.7-Plus",
    "Kimi-K3",
    "Kimi-K2.8-Preview",
    "GLM-5.3",
    "GLM-5.3-Flash",
    "DeepSeek-V4-Pro",
    "DeepSeek-Flash",
    "MiniMax-M3",
]
models_policy = "static"
stream_dialect = "sse_delta"
upstream_kind = "qoder"

biz_err = ["statusCodeValue", "quota", "unauthorized"]

login_url = "https://www.qoder.com/"
hosts = ["qoder.com", "qoder.sh", "qoder.com.cn"]

notes = "★ 原生链路：业务面 /api/v1/userinfo 取身份 → COSY 签名 → /algo/api/v2/service/pro/sse/agent_chat_generation 信封 SSE。凭据为设备授权得到的 access token（dt- 开头），面板里点「登录」走设备码流程即可。每日 Credits 需在 Qoder 桌面端领取。"

[headers]
x-qoder-region = "intl"
