# 订阅反代 —— xAI Grok（OAuth oauth_device）
# 一手来源：旧版 catalog platforms/sub-grok
# 登录：v2 登录引擎（设备码/PKCE）后续接入；当前可手动粘贴 token 走 @sub-* 路由
id = "sub-grok"
name = "xAI Grok"
enabled = true
region = "intl"
login_url = "https://grok.com"

auth = "api_key"
base_url = "https://api.x.ai/v1"
format = "openai"

# 静态兜底清单（models_policy=live：实时 /models 取不到时，面板/路由按这份展示）
models = [
    "grok-4.6",
    "grok-4.5",
    "grok-4",
    "grok-4-fast-reasoning",
    "grok-code-fast-1",
    "grok-3",
]
models_policy = "live"
stream_dialect = "sse_delta"

notes = "Grok Build 订阅登录。设备码 OAuth 流程，登录后自动获取 access_token，网关直接反代。"