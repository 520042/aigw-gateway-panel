# 官方 API —— OpenAI 兼容透传（api_key）
# 一手来源：C:/Users/liang.zhao/.dsh/our-free-model/rollback/src/providers/registry.json（37 个候选里的 ollama_cloud）
id = "api-ollama-cloud"
name = "Ollama Cloud"
enabled = true
region = "intl"

auth = "api_key"
base_url = "https://ollama.com/v1"
format = "openai"

# 静态兜底清单（models_policy=live：实时 /models 取不到时，面板/路由按这份展示）
# ★ 2026-10-26 按上游实测重写：原表有 7 个模型上游已下架（kimi-k2.5 / glm-5 / minimax-m2.5 / glm-4.7-flash 等），用户从兜底表选到就是 404。
models = [
    "gpt-oss:120b",
    "minimax-m3",
    "beam",
    "glm-5.2",
    "kimi-k2.7-code",
    "deepseek-v4-pro:0813",
    "deepseek-v4.1-flash:1017",
    "mistral-large-4",
]
models_policy = "live"
stream_dialect = "sse_delta"

login_url = "https://ollama.com/settings/keys"

notes = "Free tier: light usage, one cloud model at a time (9router notice). Tags are not OpenAI ids but Ollama model names.（免费额度通道）"
