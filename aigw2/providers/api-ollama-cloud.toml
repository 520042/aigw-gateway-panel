# 官方 API —— OpenAI 兼容透传（api_key）
# 一手来源：C:/Users/liang.zhao/.dsh/our-free-model/rollback/src/providers/registry.json（37 个候选里的 ollama_cloud）
id = "api-ollama-cloud"
name = "Ollama Cloud"
enabled = true
region = "intl"

auth = "api_key"
base_url = "https://ollama.com/v1"
format = "openai"

# 静态兜底清单（models_policy=live：实时 /models 取不到时按这份展示；拿到 Key 后以实时为准）
models = [
    "gpt-oss:120b",
    "kimi-k2.5",
    "glm-5",
    "minimax-m2.5",
    "glm-4.7-flash",
    "qwen3.5",
    "minimax-m3",
    "deepseek-v4.1-flash:cloud",
    "qwen3-coder:480b",
]
models_policy = "live"
stream_dialect = "sse_delta"

login_url = "https://ollama.com/settings/keys"

notes = "Free tier: light usage, one cloud model at a time (9router notice). Tags are not OpenAI ids but Ollama model names.（免费额度通道）"
