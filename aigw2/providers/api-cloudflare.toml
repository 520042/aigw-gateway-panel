# Cloudflare Workers AI —— v2 声明式接入
# 一手来源：旧版 catalog_sites（官方区/公益 relay）
id = "api-cloudflare"
name = "Cloudflare Workers AI"
enabled = true
region = "intl"

auth = "api_key"
base_url = "https://api.cloudflare.com/client/v4/accounts/self/ai/v1"
format = "openai"

# 静态兜底清单（models_policy=live：实时 /models 取不到时，面板/路由按这份展示）
models = [
    "@cf/meta/llama-3.3-70b-instruct-fp8-fast",
    "@cf/deepseek-ai/deepseek-r1-distill-qwen-32b",
    "@cf/moonshotai/kimi-k2.6",
    "@cf/zai-org/glm-4.7-flash",
    "@cf/qwen/qwq-32b",
    "@cf/qwen/qwen2.5-coder-32b-instruct",
    "@cf/meta/llama-3.1-8b-instruct-fp8-fast",
    "@cf/mistralai/mistral-small-3.1-24b-instruct",
]
models_policy = "live"
stream_dialect = "sse_delta"

login_url = "https://developers.cloudflare.com/workers-ai/"

notes = "免费层每天 10,000 Neurons。key 在 Cloudflare 控制台创建。"
