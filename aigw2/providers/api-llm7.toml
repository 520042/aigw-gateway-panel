    "gpt-5.5",
    "claude-opus-5",
    "deepseek-v4-flash",
    "grok-4.5",
    "kimi-k3",
    "default",
    "fast",
    "pro",
]
models_policy = "live"
stream_dialect = "sse_delta"

login_url = "https://dash.llm7.io/"

notes = "FCC also pins the default/fast/pro aliases; the listing is filtered to streaming tool models."
