stream_dialect = "sse_delta"

notes = "Google Gemini 订阅登录。Google OAuth 流程：点「接入」生成授权链接 → 浏览器登录授权 → 地址栏跳 localhost:51121/callback?code=…（页面打不开是正常的）→ 把 code= 后面那段粘贴到下方即完成登录，token 自动入库。"