# 官方 API —— OpenAI 兼容透传（api_key）
# 一手来源：旧版 catalog platforms/api-openrouter
id = "api-openrouter"
name = "OpenRouter API"
enabled = true
region = "intl"

auth = "api_key"
base_url = "https://openrouter.ai/api/v1"
format = "openai"

# 静态兜底清单（models_policy=live：实时 /models 取不到时，面板/路由按这份展示）
# ★ 2026-10-26 按上游实测重写：原表有 1 个模型上游已下架（minimax/minimax-m3.1-flash:free），用户从兜底表选到就是 404。
models = [
    "nvidia/nemotron-3-ultra-550b-a55b:free",
    "google/gemma-4-31b-it:free",
    "google/gemma-4-26b-a4b-it:free",
    "cohere/north-mini-code:free",
    "thinkingmachines/inkling:free",
    "poolside/laguna-s-2.1:free",
    "nvidia/nemotron-3.5-lightning:free",
    "liquid/lfm-2.5-2.6b:free",
    "openai/gpt-6.1-terra",
]
models_policy = "live"
stream_dialect = "sse_delta"

login_url = "https://openrouter.ai/keys"

notes = "在 OpenRouter「Keys」创建后粘贴；有 free 标签免费模型"