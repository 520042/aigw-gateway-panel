# Loomy 讯飞（loomy.xunfei.cn）—— OpenAI 兼容模型网关 + 动态 traceparent 头
# 一手来源：aigw-panel-rs/src/relay/loomy.rs（对齐 loomy2api 官方桌面客户端）
# 上游：POST {base}/chat/completions、GET {base}/models（标准 OpenAI 形态）
# 鉴权：Authorization: Bearer <session> + token: <session> 双写 +
#       每次随机 traceparent: 00-<32hex>-<16hex>-01（缺失会挂起到超时）+ loomy-version
# 凭据：账号 session（14 天有效，无 refreshToken），登录后粘贴
id = "apk-loomy"
name = "Loomy 讯飞（模型网关）"
enabled = true
region = "cn"

# 短信登录（手机号 + 验证码）：与微信扫码二选一，前端抽屉两个都提供。
# 扫码要求该微信已绑定讯飞账号；短信登录对「只有手机号号」的用户是唯一通路。
auth = "sms_code"
login_methods = ["sms", "pwd", "qr"]
base_url = "https://loomyad.xunfei.cn/api/v1"
format = "openai"
chat_path = "/chat/completions"
models_path = "/models"

# 静态兜底清单（models_policy=live：实时 /models 取不到时，面板/路由按这份展示；拿到 Key 后以实时为准）
models = [
    "GLM-5.3-Flash",
    "Kimi-k2.6",
    "MiniMax-M3",
    "deepseek-v4-flash-0731",
    "qwen-3.8-max",
    "qwen3.8-flash",
]
models_policy = "live"
stream_dialect = "sse_delta"

signer = "loomy"
biz_err = ["登录已失效", "登录", "失效", "未登录", "授权"]

login_url = "https://loomy.xunfei.cn/login"
hosts = ["loomy.xunfei.cn", "loomyad.xunfei.cn", "xunfei.cn"]

notes = "讯飞 Loomy 模型网关，模型 id 为 provider/model 形态（如 imodel/spark-x）。凭据为登录后的 session，鉴权头会自动双写 token 与 traceparent。模型清单实时拉取。"
