# 库库 AI（百度文库 GenFlowPro，kuku.baidu.com）—— wenchain 私有协议 adapter（纯 HTTP）
# 一手来源：xuzhang0807-cmd/kuku-cliproxy（Go，移植自 IKUNHEIHIE/kuku2api）
# 上游：idallochstr×2 取 chat_id/query_id → sendmsg → sse/getchatcontent（TEXT/THINKING 帧）
# 凭据：kuku.baidu.com 的 Cookie 中 BDUSS 与 STOKEN 两条（httpOnly，DevTools 里可见）
id = "apk-kuku"
name = "库库 AI（百度文库）"
enabled = true
region = "cn"

auth = "qr_scan"
login_methods = ["qr", "paste"]
base_url = "https://kuku.baidu.com"
format = "openai"

models = ["auto", "ernie-5.1", "glm-5.3", "gateway-glm-5.3-flash", "gateway-glm-5.2", "ms-kimi-k3", "gateway-kimi-k2.6", "gateway-kimi-k2.7-code-tencent", "gateway-deepseek-v4-pro-tencent", "gateway-deepseek-v4-flash-tencent", "gateway-deepseek-v4.1-flash-volcengine", "ali-minimax/minimax-m3"]
models_policy = "static"
stream_dialect = "sse_delta"

upstream_kind = "kuku"
biz_err = ["未登录", "登录", "失效", "积分不足"]

login_url = "https://kuku.baidu.com/"
hosts = ["baidu.com", "kuku.baidu.com"]

notes = "登录 kuku.baidu.com 后，从 DevTools→Application→Cookies 复制整段 Cookie（需含 BDUSS 和 STOKEN）。auto 自动选模型；积分不足会明确提示。1 积分≈1 万 Token。"
