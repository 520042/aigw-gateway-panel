# 官方 API —— OpenAI 兼容透传（api_key）
# 一手来源：旧版 catalog platforms/api-groq
id = "api-groq"
name = "Groq API"
enabled = true
region = "intl"

auth = "api_key"
base_url = "https://api.groq.com/openai/v1"
format = "openai"

# 静态兜底清单（models_policy=live：实时 /models 取不到时，面板/路由按这份展示）
models = [
    "llama-3.3-70b-versatile",
    "meta-llama/llama-4-maverick-17b-128e-instruct",
    "qwen/qwen3-32b",
    "openai/gpt-oss-120b",
]
models_policy = "live"
stream_dialect = "sse_delta"

login_url = "https://console.groq.com/keys"

notes = "在 Groq Console 创建后粘贴（免费档极低延迟）"