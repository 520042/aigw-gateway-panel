# 千问办公 QwenWork（阿里）—— OpenAI 兼容端点（/api/v1/chat/completions）
# 实测 2026-10-22：GET https://qwenwork.cn/api/v1/models → 401 "Request denied by JWT Auth check. JWT is missing."
# 说明端点确实存在且是 OpenAI 形状，只是要求 JWT；旧规格误用了根路径 /chat/completions，故一直 404。
id = "apk-qwenwork"
name = "千问办公 QwenWork（阿里）"
enabled = true
region = "cn"

auth = "api_key"
base_url = "https://qwenwork.cn"
format = "openai"
chat_path = "/api/v1/chat/completions"
models_path = "/api/v1/models"
models_policy = "live"
stream_dialect = "sse_delta"

login_url = "https://qwenwork.cn/signin"
hosts = ["qwenwork.cn", "aliyun.com"]

notes = "★ 凭据填 **JWT 本体**（eyJ… 开头），面板按 Authorization: Bearer <JWT> 发送（qwenwork 网关认 cookie token= 或 Bearer，二选一即可）。取法：登录 qwenwork.cn → F12 → Application → Cookies/Local Storage 找以 eyJ 开头的 token。加完账号点「拉取模型」即可看到可用模型。"
