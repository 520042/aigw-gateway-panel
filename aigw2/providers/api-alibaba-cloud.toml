# 官方 API —— OpenAI 兼容透传（api_key）
# 一手来源：C:/Users/liang.zhao/.dsh/our-free-model/rollback/src/providers/registry.json（37 个候选里的 alibaba_cloud）
id = "api-alibaba-cloud"
name = "Alibaba Cloud"
enabled = true
region = "cn"

auth = "api_key"
base_url = "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
