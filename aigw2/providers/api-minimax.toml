# 官方 API —— OpenAI 兼容透传（api_key）
# 一手来源：旧版 catalog platforms/api-minimax
id = "api-minimax"
name = "MiniMax API"
enabled = true
region = "cn"

auth = "api_key"
base_url = "https://api.minimax.chat/v1"
format = "openai"

# 静态兜底清单（models_policy=live：实时 /models 取不到时，面板/路由按这份展示）
models = [
    "MiniMax-M3",
    "MiniMax-M2.7",
    "MiniMax-M2.5",
    "MiniMax-M2.1",
]
models_policy = "live"
stream_dialect = "sse_delta"

login_url = "https://platform.minimaxi.com/"

notes = "在 MiniMax 开放平台创建后粘贴"