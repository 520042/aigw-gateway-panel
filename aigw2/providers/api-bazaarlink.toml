models = [
    "auto:free",
    "claude-opus-4.7",
    "claude-sonnet-4.6",
    "claude-haiku-4.5",
    "gpt-5.5",
    "gpt-5.4",
    "gpt-5.4-mini",
    "grok-4.3",
    "grok-4.20",
    "gemini-3.1-pro-preview",
    "gemini-3-flash-preview",
    "gemini-3.1-flash-lite-preview",
    "minimax-m3",
    "qwen3.6-plus",
]
models_policy = "live"
stream_dialect = "sse_delta"

login_url = "https://bazaarlink.ai"

notes = "Multi-vendor gateway with an auto:free slug; 9router lists it as free-tier.（免费额度通道）"
