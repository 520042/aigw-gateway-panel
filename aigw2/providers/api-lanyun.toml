# 官方 API —— OpenAI 兼容透传（api_key）
# 一手来源：_refs/CherryHQ-cherry-studio packages/provider-registry/data/providers.json（version 1b44511badb438e6）
id = "api-lanyun"
name = "蓝耘（LANYUN）MaaS"
enabled = true
region = "cn"

auth = "api_key"
base_url = "https://maas-api.lanyun.net/v1"
format = "openai"

# 静态兜底清单（models_policy=live：实时 /models 取不到时，面板/路由按这份展示）
# ★ 2026-10-26 按上游实测重写：原表有 4 个模型上游已下架（deepseek-v3.1 / /maas/zhipuai/GLM-5 / MiniMax-M2.1 / qwen3-32b），用户从兜底表选到就是 404。
models = [
    "/maas/deepseek-ai/DeepSeek-V3.2",
    "automodel",
    "kimi-k3",
    "kimi-k2.7-code",
    "glm-5.3",
    "glm-5.3-flash",
    "/maas/minimax/MiniMax-M2.5",
    "minimax-m2.7",
]
models_policy = "live"
stream_dialect = "sse_delta"

login_url = "https://maas.lanyun.net/#/system/apiKey"

notes = "国内 GPU 云 MaaS；部分模型名带 /maas/ 前缀，以控制台模型广场为准。"
