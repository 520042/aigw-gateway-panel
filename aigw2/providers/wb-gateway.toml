# WorkBuddy 国内站（workbuddy.cn / copilot.tencent.com）—— 账号设备授权接入
# 一手来源：_refs/workbuddy2api-master（admin/wb_login.py 设备授权链路 + converter.py 对话转发
#          + proxy.py 头族 + client_profile.py 参数档案 + upstream_compat.py 请求体归一）
#
# 接入方式 = 账号登录，不是填 Key、也不需要本地客户端：
#   面板「开始登录」→ POST https://copilot.tencent.com/v2/plugin/auth/state?platform=workbuddy
#   → 返回 authUrl（workbuddy.cn 登录页）→ 用户在自己的浏览器登录
#   → 面板轮询 /v2/plugin/auth/token?state=… 自动拿到 accessToken 入库（含 domain）。
# 全过程在**服务端**发起普通 HTTPS 请求，没有任何本地进程 / 本地端口依赖，
# 因此可以直接部署在服务器上（本机只是众多部署形态之一）。
#
# 对话转发 = POST /v2/chat/completions（同一个 copilot.tencent.com 中继）。
# 上游按官方客户端特征做风控，请求头由 relay 的 signer="wb" 整族注入：
#   X-Agent-Purpose / X-IDE-Name·X-IDE-Type·X-Product·X-IDE-Version（client_profile 档案）
#   X-CodeBuddy-Request / Accept-Language / X-Requested-With（官方客户端闸门）
#   X-User-Id / X-Machine-ID·X-Session-ID（按 uid 稳定派生，跨重启恒定）
#   会话头族 X-Conversation-* / X-Request-ID / B3（换号重试复用同一 ID）
#   X-Domain（登录时上游给的账号域，随凭据一起存）
id = "wb-gateway"
name = "WorkBuddy 国内站"
enabled = true
region = "cn"

# 认证方式 = 账号设备授权（OAuth 设备流）：用户点「开始登录」→ 上游出授权页 →
# 登录完成后面板自动换到 accessToken 入库。**不是**填 API Key，也不需要本地客户端。
auth = "o_auth_device"
base_url = "https://copilot.tencent.com"
format = "openai"

models = [
    "auto", "hy4-preview", "hy3", "hy3-x",
    "deepseek-v4.1-flash", "deepseek-v4-pro", "deepseek-v4-flash",
    "glm-5.3", "glm-5.3-flash", "glm-5.2", "glm-5.1", "glm-5v-turbo",
    "kimi-k3-1", "kimi-k2.8-preview", "kimi-k2.7", "kimi-k2.6",
    "minimax-m3",
]
models_policy = "static"
chat_path = "/v2/chat/completions"
signer = "wb"
stream_dialect = "sse_delta"

biz_err = ["登录", "失效", "授权"]

notes = "账号设备授权接入（服务端纯 HTTPS，无本地客户端 / 无本地端口依赖，可直接部署服务器）。凭据=登录后上游签发的 accessToken（JWT，实测约 27 天），连同账号域一起入库；过期后重新点一次「开始登录」。上游只支持流式，非流式请求由面板自动改写成流式再聚合。"
