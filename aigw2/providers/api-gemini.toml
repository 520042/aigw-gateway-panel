# Google Gemini（AI Studio） —— v2 声明式接入
# 一手来源：旧版 catalog_sites（官方区/公益 relay）
id = "api-gemini"
name = "Google Gemini（AI Studio）"
enabled = true
region = "intl"

auth = "api_key"
# ★ base_url 取**域名根**、两条路径分别写全：
#   Gemini 的 OpenAI 兼容层（/v1beta/openai）**没有** models 端点 —— 实测那里 404，
#   而原生 /v1beta/models 是 403（需要 Key，即存在）。
#   base_url 与路径是直接拼接（format!("{base}{path}")），没法在 base_url 带
#   /v1beta/openai 的同时让清单走 /v1beta/models，所以这里把 base_url 收成域名根。
base_url = "https://generativelanguage.googleapis.com"
chat_path = "/v1beta/openai/chat/completions"
models_path = "/v1beta/models"
format = "openai"

# 静态兜底清单（models_policy=live：实时 /models 取不到时，面板/路由按这份展示）
models = [
    "gemini-3.8-flash",
    "gemini-3.7-flash",
    "gemini-3.6-flash",
    "gemini-3.5-flash-lite",
    "gemini-3.1-pro-preview",
    "gemini-3.1-flash-lite-preview",
    "gemini-2.5-pro",
    "gemini-2.5-flash",
]
models_policy = "live"
stream_dialect = "sse_delta"

login_url = "https://aistudio.google.com/apikey"

notes = "Gemini 免费层 15 RPM/1500 RPD。key 在 AI Studio 创建，Bearer 直连。"
