[workspace]
resolver = "2"
members = [
    "crates/aigw-core",
    "crates/aigw-crypto",
    "crates/aigw-registry",
    "crates/aigw-store",
    "crates/aigw-pool",
    "crates/aigw-relay",
    "crates/aigw-server",
    "crates/aigw",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
rust-embed = "8"
mime_guess = "2"
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
futures-util = "0.3"
tokio-stream = "0.1"
rand = "0.8"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
aes-gcm = "0.10"
rsa = "0.9"
base64 = "0.22"

[profile.release]
lto = "thin"
strip = true
