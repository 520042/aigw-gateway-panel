[workspace]
resolver = "2"
members = [
    "crates/aigw-core",
    "crates/aigw-crypto",
    "crates/aigw-registry",
    "crates/aigw-store",
    "crates/aigw-pool",
    "crates/aigw-relay",
    "crates/aigw-server",
    "crates/aigw",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
rust-embed = "8"
mime_guess = "2"
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
# ★ 2026-10-26 补 br（Brotli）：上游清单/响应越来越多用 br 压缩
#   （实测 ai-gateway.vercel.sh、api.kilo.ai、api.featherless.ai 都返回 br）。
#   没有这个特性时 reqwest 不会解压 br，拿到的仍是压缩字节 —— 表现为
#   「HTTP 200 但 error decoding response body」，三个源的模型清单一直拉不到。
#   特性名是 brotli（不是 br）。gzip/deflate 在 0.12 也需显式开。
reqwest = { version = "0.12", features = ["stream", "json", "brotli", "gzip", "deflate"] }
futures-util = "0.3"
tokio-stream = "0.1"
rand = "0.8"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
aes-gcm = "0.10"
rsa = "0.9"
base64 = "0.22"
wasmi = "0.31"

[profile.release]
lto = "thin"
strip = true

# wasm 求解器（DeepSeek POW）跑在 dev profile 下是解释执行 + 无优化，
# 7 万次候选要 15 秒；只把 wasmi 自身按 -O3 编译，安装包/开发构建都能回到百毫秒级。
[profile.dev.package.wasmi]
opt-level = 3

[profile.dev.package.wasmi_core]
opt-level = 3
