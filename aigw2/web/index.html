<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>aigw v2 · 控制台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b1d22'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%2359c8ff'%3E%E2%97%88%3C/text%3E%3C/svg%3E">
<!-- 主题在样式表之前定下来，避免首帧闪白（FOUC）。 -->
<script>
(function () {
  try {
    var t = localStorage.getItem('aigw-theme') || 'auto';
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<!-- 运行时样式：复用现有设计令牌与页面级规则。顺序有意义，主干必须在前。 -->
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/css/pages.css">
<link rel="stylesheet" href="/css/access.css">
  <script type="module" crossorigin src="/app/app.js"></script>
  <link rel="stylesheet" crossorigin href="/app/app.css">
</head>
<body>
<div id="root"></div>
</body>
</html>
