<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 静态资源版本不在这里手写：服务端统一发 Cache-Control: no-cache，
     app.js 自己的 BUILD 常量才是唯一版本号（改前端只需 cargo build）。 -->
<title>aigw v2 · 控制台</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <aside class="side">
    <div class="brand"><span class="logo">◈</span><span>aigw v2</span></div>
    <nav class="nav">
      <button class="navbtn on" data-v="overview"><span class="ic">◎</span>总览</button>
      <button class="navbtn" data-v="sources"><span class="ic">◈</span>接入源</button>
      <!-- ★ 2026-10-28（用户要求）：账号栏改为「模型与用量」——账号运维与模型清单、
           用量看板同属「已接入资源怎么用/用了多少」，放一栏才符合使用路径。 -->
      <button class="navbtn" data-v="accounts"><span class="ic">☰</span>模型与用量</button>
      <button class="navbtn" data-v="usage"><span class="ic">◔</span>用量明细</button>
      <!-- ★ 2026-10-26（P3）：运行配置（并发/超时/重试/限流，热更新无需重启） -->
      <button class="navbtn" data-v="runtime"><span class="ic">⚙</span>运行配置</button>
      <button class="navbtn" data-v="about"><span class="ic">ⓘ</span>关于</button>
    </nav>
    <div class="side-foot" id="foot">v2</div>
  </aside>
  <main class="main">
    <div class="hd">
      <h1 id="ttl">总览</h1>
      <div class="sub" id="stl">加载中…</div>
      <div class="hdbtns" id="hdbtns"></div>
    </div>
    <div id="view"></div>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
