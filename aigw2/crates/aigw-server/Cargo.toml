[package]
name = "aigw-server"
version.workspace = true
edition.workspace = true

[dependencies]
aigw-core = { path = "../aigw-core" }
aigw-registry = { path = "../aigw-registry" }
aigw-store = { path = "../aigw-store" }
aigw-pool = { path = "../aigw-pool" }
aigw-relay = { path = "../aigw-relay" }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rust-embed = { workspace = true, features = ["interpolate-folder-path", "include-exclude"] }
mime_guess = { workspace = true }
tracing = { workspace = true }
futures-util = { workspace = true }
rand = { workspace = true }
base64 = "0.22"
# 响应压缩。/api/platforms 实测 166KB 未压缩 JSON，gzip 后约 20KB ——
# 面板首屏与「接入源」页的主要传输成本都在这里。
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br"] }

[dev-dependencies]
tower = { workspace = true }
http-body-util = { workspace = true }
toml = { workspace = true }
tempfile = "3"
