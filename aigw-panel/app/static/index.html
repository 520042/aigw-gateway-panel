<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 资源整合网关面板</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <aside class="side">
    <div class="brand"><span class="logo">◈</span>AI 资源网关</div>
    <div class="navgrp">监控</div>
    <button class="navbtn on" data-v="dash"><span class="ic">◎</span>总览</button>
    <button class="navbtn" data-v="gateway"><span class="ic">▣</span>网关与账号</button>
    <button class="navbtn" data-v="usage"><span class="ic">◔</span>用量看板</button>
    <button class="navbtn" data-v="route"><span class="ic">⇄</span>智能路由</button>
    <div class="navgrp">账号与权益</div>
    <button class="navbtn" data-v="login"><span class="ic">⎔</span>账号登录</button>
    <button class="navbtn" data-v="toolcall"><span class="ic">⚒</span>工具调用</button>
    <button class="navbtn" data-v="autocheckin"><span class="ic">⏰</span>自动签到</button>
    <button class="navbtn" data-v="checkin"><span class="ic">✓</span>签到中心</button>
    <button class="navbtn" data-v="growth"><span class="ic">✦</span>成长任务</button>
    <button class="navbtn" data-v="tasks"><span class="ic">☰</span>任务中心</button>
    <div class="navgrp">模型与资源</div>
    <button class="navbtn" data-v="models"><span class="ic">⌗</span>模型与倍率</button>
    <button class="navbtn" data-v="upstreams"><span class="ic">▤</span>上游档案</button>
    <button class="navbtn" data-v="sites"><span class="ic">☷</span>资源站点</button>
    <button class="navbtn" data-v="catalog"><span class="ic">★</span>免费资源导航</button>
    <div class="navgrp">系统</div>
    <button class="navbtn" data-v="notify"><span class="ic">✉</span>通知中心</button>
    <button class="navbtn" data-v="logs"><span class="ic">≡</span>日志</button>
    <button class="navbtn" data-v="settings"><span class="ic">⚙</span>设置</button>
    <div style="flex:1"></div>
    <div class="row n" style="padding:0 6px 8px;gap:6px">
      <button class="btn sm gh" id="themeBtn" onclick="toggleTheme()" title="切换亮/暗主题">◐ 主题</button>
      <div class="faint" style="font-size:11.5px;margin-left:auto" id="sideFoot">v1.0.0</div>
    </div>
  </aside>

  <main class="main">
    <div class="hd">
      <div>
        <h1 id="ttl">总览</h1>
        <div class="sub" id="stl">正在加载…</div>
      </div>
      <div class="flex">
        <button class="btn" onclick="refresh()">↻ 刷新</button>
        <button class="btn pri" id="hdCheckin" onclick="quickCheckin()">✓ 立即签到</button>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
