<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 资源整合网关面板</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <aside class="side">
    <div class="brand"><span class="logo">◈</span>AI 资源网关</div>

    <div class="navgrp">主流程</div>
    <button class="navbtn on" data-v="sources"><span class="ic">◈</span>接入源</button>
    <button class="navbtn" data-v="route"><span class="ic">⇄</span>路由与模型</button>

    <div class="navgrp">更多</div>
    <button class="navbtn" data-v="tools"><span class="ic">⚒</span>工具与集成</button>
    <button class="navbtn" data-v="settings"><span class="ic">⚙</span>设置与日志</button>

    <div style="flex:1"></div>
    <div class="faint" style="padding:8px 10px;font-size:11px;line-height:1.6">
      统一网关<br>
      <span id="sideFoot">v1.0.0</span>
    </div>
  </aside>

  <main class="main">
    <div class="hd">
      <div>
        <h1 id="ttl">接入源</h1>
        <div class="sub" id="stl">正在加载…</div>
      </div>
      <div class="flex">
        <button class="btn" onclick="copyEndpoint()">复制网关地址</button>
        <button class="btn pri" id="hdOneClick" onclick="oneClick()"
          title="所有已接入的源跑一轮签到与任务">⚡ 一键执行</button>
        <button class="btn dgr" onclick="quitPanel()"
          title="退出面板（关浏览器页面不等于退出）">退出</button>
      </div>
    </div>
    <div id="oneClickBox"></div>
    <div id="view"></div>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
